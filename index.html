<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://esm.run https://cdn.jsdelivr.net; worker-src 'self' blob:; connect-src 'self' https://esm.run https://cdn.jsdelivr.net https://huggingface.co https://cdn-lfs.huggingface.co; style-src 'self' 'unsafe-inline';">
    
    <title>English Steps — английский с нуля</title>
    
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('english-app:theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (theme === 'dark' || (theme !== 'light' && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
